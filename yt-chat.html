<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>YT SEO Studio Pro — YT Data Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@700;800&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232F9BFF'/%3E%3C/svg%3E" />
<style>
:root{
  --bg-0:#F4F9FF; --bg-1:#FFFFFF; --bg-2:#EAF4FF;
  --glass-brd: rgba(15,23,42,0.08);
  --gold:#2F9BFF; --gold-dim:#1C7FE0; --gold-glow:rgba(47,155,255,.30);
  --sky:#38BDF8; --sky-dim:#0EA5E9; --cyan:#14B8A6; --teal:#0D9488; --violet:#8B5CF6; --pink:#EC4899;
  --green:#22C55E; --amber:#F59E0B; --red:#EF4444;
  --tx-1:#0F1B2D; --tx-2:#51627A; --tx-3:#8B9AB0;
  --bd:rgba(15,23,42,.09); --bd-strong:rgba(15,23,42,.16);
  --font:'Inter',-apple-system,'Segoe UI',sans-serif; --font-d:'Manrope',var(--font);
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font); background:var(--bg-0); color:var(--tx-1); height:100vh; display:flex; flex-direction:column;
  background-image:
    radial-gradient(ellipse 65% 40% at 12% -8%, rgba(56,189,248,.20), transparent 60%),
    radial-gradient(ellipse 55% 35% at 105% 0%, rgba(139,92,246,.13), transparent 55%);
  background-attachment:fixed; -webkit-font-smoothing:antialiased;
}
.icon{width:18px;height:18px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none;display:inline-block;vertical-align:middle;}
.icon-sm{width:14px;height:14px;stroke-width:2.1;}
.hidden{display:none !important;}
@keyframes popIn{from{opacity:0;transform:scale(.94) translateY(4px);}to{opacity:1;transform:none;}}
@keyframes spin{to{transform:rotate(360deg);}}
.topbar{flex:none;display:flex;align-items:center;justify-content:space-between;padding:14px 18px;backdrop-filter:blur(14px);background:rgba(255,255,255,.85);border-bottom:1px solid var(--bd);}
.brand{display:flex;align-items:center;gap:10px;}
.brand__mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(145deg,var(--sky),var(--violet));display:grid;place-items:center;box-shadow:0 4px 18px var(--gold-glow);}
.brand__mark svg{width:19px;height:19px;fill:#fff;stroke:none;}
.brand__title{font-family:var(--font-d);font-weight:800;font-size:15px;}
.brand__title small{display:block;font-family:var(--font);font-weight:500;font-size:10px;color:var(--tx-3);letter-spacing:.05em;text-transform:uppercase;}
.top-actions{display:flex;gap:8px;align-items:center;}
.back-link{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--gold-dim);text-decoration:none;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:10px;border:1px solid var(--bd-strong);background:#fff;color:var(--tx-1);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;}
.btn--gold{background:linear-gradient(120deg,var(--sky),var(--gold),var(--violet));background-size:200% 200%;color:#fff;border:none;}
.btn--ghost{background:transparent;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.loader-ring{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid rgba(15,23,42,.18);border-top-color:currentColor;animation:spin .7s linear infinite;}

.thread{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto;width:100%;}
.msg{max-width:88%;font-size:13.5px;line-height:1.55;padding:11px 15px;border-radius:16px;animation:popIn .2s var(--ease);}
.msg.bot{align-self:flex-start;background:var(--bg-1);border:1px solid var(--bd);}
.msg.user{align-self:flex-end;background:linear-gradient(120deg,var(--sky),var(--violet));color:#fff;}
.msg.data{align-self:stretch;max-width:100%;background:var(--bg-1);border:1px solid var(--bd);}
.data-head{font-size:11px;font-weight:800;color:var(--tx-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.codebox{background:#0F1B2D;color:#BEE3FF;border-radius:12px;padding:12px 14px;font-family:'SF Mono',Consolas,monospace;font-size:12px;line-height:1.85;white-space:pre-wrap;max-height:340px;overflow-y:auto;}
.codebox .rk{color:#7CF0B0;font-weight:800;}
.codebox .num{color:#8FD8FF;}
.data-actions{display:flex;gap:8px;margin-top:10px;}
.data-actions .btn{font-size:11.5px;padding:7px 12px;}
.composer{flex:none;border-top:1px solid var(--bd);background:rgba(255,255,255,.9);backdrop-filter:blur(10px);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom));}
.composer-inner{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:flex-end;}
.composer textarea{flex:1;resize:none;border:1px solid var(--bd);border-radius:14px;padding:11px 14px;font-family:inherit;font-size:13.5px;outline:none;max-height:110px;background:#F5FAFF;}
.composer textarea:focus{border-color:var(--gold-dim);background:#fff;}
.send-btn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--sky),var(--violet));color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;}
.send-btn:disabled{opacity:.5;cursor:not-allowed;}
.suggest-row{display:flex;flex-wrap:wrap;gap:6px;max-width:760px;margin:0 auto 10px;padding:0 16px;}
.suggest-chip{font-size:11.5px;font-weight:600;padding:6px 11px;border-radius:20px;background:#F0F7FF;border:1px solid var(--bd);color:var(--tx-2);cursor:pointer;}
.suggest-chip:hover{border-color:var(--gold-dim);color:var(--tx-1);}
.info-box{display:flex;gap:8px;padding:10px 12px;border-radius:10px;background:#F0F7FF;border:1px solid var(--bd);font-size:11.5px;color:var(--tx-2);}
.info-box .icon{color:var(--gold-dim);flex:none;margin-top:1px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand__mark"><svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></div>
    <div class="brand__title">YT Data Chat<small>Talk freely &mdash; real YouTube data on request</small></div>
  </div>
  <div class="top-actions">
    <button id="clearBtn" class="btn btn--ghost" type="button" title="Clear conversation"><svg class="icon icon-sm" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    <a class="back-link" href="index.html"><svg class="icon icon-sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Back</a>
  </div>
</header>

<div class="suggest-row" id="suggestRow">
  <span class="suggest-chip" data-q="এই নিশ এর জন্য shorts ট্যাগ দাও: cooking">shorts ট্যাগ &mdash; cooking</span>
  <span class="suggest-chip" data-q="Give me long-video titles for the niche: personal finance">long titles &mdash; personal finance</span>
  <span class="suggest-chip" data-q="এই নিশ এর tags আর titles দুটোই দাও: gadget review">tags+titles &mdash; gadget review</span>
</div>

<div id="thread" class="thread"></div>

<div class="composer">
  <div class="composer-inner">
    <textarea id="chatInput" rows="1" placeholder="যেকোনো কিছু জিজ্ঞেস করুন, অথবা কোনো niche-এর tags/titles চান বললেই real YouTube data আনব..."></textarea>
    <button id="sendBtn" class="send-btn" type="button"><svg class="icon icon-sm" viewBox="0 0 24 24" style="stroke:#fff;"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
  </div>
</div>

<script>
(function(){
"use strict";
var YT_API="https://www.googleapis.com/youtube/v3/";
var GEM_API="https://generativelanguage.googleapis.com/v1beta/models/";
var CFG_KEY="ytSeoPro.cfg.v1";
var HIST_KEY="ytSeoPro.chatHistory.v2";

function safeParse(r,f){ if(!r) return f; try{return JSON.parse(r);}catch(e){return f;} }
function readCfg(){ var s=safeParse(localStorage.getItem(CFG_KEY),{}); return { geminiKeys:Array.isArray(s.geminiKeys)?s.geminiKeys:(s.geminiKey?[s.geminiKey]:[]), geminiModel:s.geminiModel||"gemini-3.5-flash", oauth:Object.assign({accessToken:null,expiresAt:0},s.oauth||{}) }; }
function isOAuthValid(){ var c=readCfg(); return !!(c.oauth&&c.oauth.accessToken&&c.oauth.expiresAt>Date.now()); }
function getToken(){ return readCfg().oauth.accessToken; }
function hasGeminiKey(){ return readCfg().geminiKeys.length>0; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function fmtNum(n){ var v=parseInt(n||"0",10); if(isNaN(v))return "0"; if(v>=1000000)return (v/1000000).toFixed(1)+"M"; if(v>=1000)return (v/1000).toFixed(1)+"K"; return String(v); }
function cleanQueryText(text){
  text=(text||"").replace(/#[\w\u0980-\u09FF]+/g,"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").replace(/[!?।"'`~^*_=+<>|\\]/g," ").replace(/\s+/g," ").trim();
  return text;
}

/* ---------- YouTube API ---------- */
function ytFetch(path, params){
  if(!isOAuthValid()) return Promise.reject(new Error("Not connected. Please connect YouTube from the main app (Me tab) first."));
  var qs=new URLSearchParams(params||{}).toString();
  return fetch(YT_API+path+(qs?"?"+qs:""),{headers:{Authorization:"Bearer "+getToken()}}).then(function(res){
    if(!res.ok) return res.json().catch(function(){return{};}).then(function(j){ throw new Error((j.error&&j.error.message)||("YouTube API error "+res.status)); });
    return res.json();
  });
}
function fetchVideosByIds(ids){
  var batches=[]; for(var i=0;i<ids.length;i+=50) batches.push(ids.slice(i,i+50));
  var all=[];
  return batches.reduce(function(chain,b){ return chain.then(function(){ return ytFetch("videos",{part:"snippet,statistics,contentDetails",id:b.join(",")}).then(function(r){ all=all.concat(r.items||[]); }); }); },Promise.resolve()).then(function(){return all;});
}
function fetchTopVideosForQuery(query, videoDuration, pageToken){
  var params={part:"snippet",q:query,type:"video",maxResults:"50",order:"relevance"};
  if(videoDuration && videoDuration!=="both") params.videoDuration=videoDuration; // "short"(<4min, closest proxy for Shorts) | "long"(>20min)
  if(pageToken) params.pageToken=pageToken;
  return ytFetch("search",params).then(function(sr){
    var ids=(sr.items||[]).map(function(it){return it.id.videoId;}).filter(Boolean);
    if(!ids.length) return {videos:[], nextPageToken:null};
    return fetchVideosByIds(ids).then(function(videos){ return {videos:videos, nextPageToken:sr.nextPageToken||null}; });
  });
}
function buildTagFrequency(videos){
  var freq={};
  videos.forEach(function(v){
    var views=parseInt((v.statistics&&v.statistics.viewCount)||"0",10);
    ((v.snippet&&v.snippet.tags)||[]).forEach(function(t){
      var k=(t||"").trim(); if(!k) return; var kk=k.toLowerCase();
      if(!freq[kk]) freq[kk]={tag:k,count:0,totalViews:0};
      freq[kk].count++; freq[kk].totalViews+=views;
    });
  });
  return freq;
}
function rankedTagsFromFrequency(freq, limit){
  return Object.keys(freq).map(function(k){return freq[k];})
    .sort(function(a,b){ return (b.count*Math.log(1+b.totalViews)) - (a.count*Math.log(1+a.totalViews)); })
    .slice(0, limit||30)
    .map(function(f){ return {text:f.tag, usedByCount:f.count}; });
}
function topTitlesReference(videos, limit){
  return videos.slice().sort(function(a,b){ return parseInt((b.statistics&&b.statistics.viewCount)||0,10)-parseInt((a.statistics&&a.statistics.viewCount)||0,10); })
    .slice(0, limit||15)
    .map(function(v){ return {title:(v.snippet&&v.snippet.title)||"", views:parseInt((v.statistics&&v.statistics.viewCount)||0,10)}; });
}

/* ---------- Gemini (router + free chat) ---------- */
function geminiCall(prompt, jsonMode){
  var keys=readCfg().geminiKeys;
  if(!keys.length) return Promise.reject(new Error("NO_GEMINI_KEY"));
  function attempt(i){
    if(i>=keys.length) return Promise.reject(new Error("All Gemini keys failed."));
    var url=GEM_API+readCfg().geminiModel+":generateContent?key="+encodeURIComponent(keys[i]);
    var body={contents:[{parts:[{text:prompt}]}]};
    if(jsonMode) body.generationConfig={responseMimeType:"application/json",temperature:0.4};
    return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(res){
      if(!res.ok){ if((res.status===429||res.status===403)&&i+1<keys.length) return attempt(i+1); return res.json().catch(function(){return{};}).then(function(j){throw new Error((j.error&&j.error.message)||("Gemini error "+res.status));}); }
      return res.json();
    }).then(function(data){
      var text=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts[0]&&data.candidates[0].content.parts[0].text;
      if(!text) throw new Error("Empty response from Gemini.");
      return text;
    });
  }
  return attempt(0);
}
function geminiJSON(prompt){
  return geminiCall(prompt, true).then(function(text){
    try{ return JSON.parse(text.replace(/^```json\s*/i,"").replace(/```\s*$/,"").trim()); }
    catch(e){ throw new Error("Could not parse Gemini's JSON."); }
  });
}

/* ==================== STATE / PERSISTENCE ==================== */
var messages = safeParse(localStorage.getItem(HIST_KEY), []);
function persist(){ localStorage.setItem(HIST_KEY, JSON.stringify(messages.slice(-200))); }
function pushMsg(m){ messages.push(m); persist(); return m; }

var threadEl=document.getElementById("thread");
function renderAll(){
  threadEl.innerHTML="";
  if(!messages.length){
    appendBubble({role:"bot", text:"হ্যালো! আমার সাথে সাধারণ কথাও বলতে পারেন, অথবা বলুন কোনো niche-এর জন্য tags/titles চান (shorts বা long ভিডিওর জন্য) — তখনই আমি real YouTube API থেকে ডেটা এনে দেখাব।"}, false);
    return;
  }
  messages.forEach(function(m){ appendBubble(m, false); });
  threadEl.scrollTop=threadEl.scrollHeight;
}
function appendBubble(m, doPersist){
  var el=document.createElement("div");
  if(m.role==="user"){ el.className="msg user"; el.textContent=m.text; }
  else if(m.role==="data"){
    el.className="msg data";
    el.innerHTML = (m.intro?('<div style="margin-bottom:8px;">'+esc(m.intro)+'</div>'):"") +
      '<div class="data-head"><span>'+esc(m.heading||"Real YouTube Data")+'</span></div>'+
      '<div class="codebox" data-codeidx="'+m._idx+'">'+renderCodeboxContent(m.items,m.kind)+'</div>'+
      '<div class="data-actions">'+
        '<button class="btn btn--gold copy-btn" data-idx="'+m._idx+'" type="button">Copy All</button>'+
        (m.canExpand!==false ? '<button class="btn btn--ghost more-btn" data-idx="'+m._idx+'" type="button">More Related</button>' : '')+
      '</div>';
  } else { el.className="msg bot"; el.innerHTML=esc(m.text).replace(/\n/g,"<br>"); }
  threadEl.appendChild(el);
  if(doPersist!==false){} // persistence handled by pushMsg
  threadEl.scrollTop=threadEl.scrollHeight;
  return el;
}
function renderCodeboxContent(items, kind){
  return (items||[]).map(function(it,i){
    var label = kind==="titles" ? (it.title+"  ("+fmtNum(it.views)+" views)") : (it.text+"  (used by "+it.usedByCount+" videos)");
    return '<span class="rk">#'+(i+1)+'</span> '+esc(label);
  }).join("\n");
}
function plainCodeText(items, kind){
  return (items||[]).map(function(it,i){
    var label = kind==="titles" ? it.title : it.text;
    return "#"+(i+1)+" "+label;
  }).join("\n");
}

/* ==================== DATA FETCH FLOW ==================== */
var dataStore={}; // idx -> {items, kind, query, videoDuration, nextPageToken}
var dataIdxCounter=0;

function runDataRequest(parsed){
  var kind = parsed.dataType==="tags" ? "tags" : parsed.dataType==="titles" ? "titles" : "both";
  var vd = parsed.videoType==="shorts" ? "short" : parsed.videoType==="long" ? "long" : "both";
  var query = cleanQueryText(parsed.niche || "");
  if(!query){ appendBubble(pushMsg({role:"bot", text:"কোন niche/topic-এর জন্য চাই সেটা একটু স্পষ্ট করে বলবেন?"})); return; }

  var loadingEl=appendBubble({role:"bot", text:"YouTube API থেকে "+query+" নিয়ে real ডেটা আনছি..."}, false);

  fetchTopVideosForQuery(query, vd).then(function(res){
    loadingEl.remove();
    if(!res.videos.length){
      appendBubble(pushMsg({role:"bot", text:"এই niche-এ কোনো ফলাফল পাইনি। অন্য কিছু দিয়ে চেষ্টা করুন।"}));
      return;
    }
    var idx=dataIdxCounter++;
    var tagItems = kind!=="titles" ? rankedTagsFromFrequency(buildTagFrequency(res.videos), 25) : [];
    var titleItems = kind!=="tags" ? topTitlesReference(res.videos, 15) : [];
    var items = kind==="titles" ? titleItems : kind==="tags" ? tagItems : tagItems; // "both" shown as two messages below
    dataStore[idx]={ query:query, videoDuration:vd, nextPageToken:res.nextPageToken, seenIds:res.videos.map(function(v){return v.id;}) };

    if(kind==="both"){
      var idxT=dataIdxCounter++;
      dataStore[idxT]={ query:query, videoDuration:vd, nextPageToken:res.nextPageToken, seenIds:res.videos.map(function(v){return v.id;}) };
      var mTags=pushMsg({role:"data", intro:"এই niche ("+esc(query)+") থেকে "+res.videos.length+"টা real ভিডিও ঘেঁটে পাওয়া ট্যাগ, ব্যবহারের সংখ্যা অনুযায়ী র‍্যাংক করা:", heading:"Real Tags", items:tagItems, kind:"tags", _idx:idx});
      appendBubble(mTags);
      var mTitles=pushMsg({role:"data", intro:"একই ডেটা থেকে সবচেয়ে বেশি-ভিউ টাইটেলগুলো:", heading:"Real Titles", items:titleItems, kind:"titles", _idx:idxT});
      appendBubble(mTitles);
    } else {
      var m=pushMsg({role:"data", intro:res.videos.length+"টা real ভিডিও ঘেঁটে "+(kind==="titles"?"সবচেয়ে বেশি-ভিউ টাইটেল":"সবচেয়ে বেশি-ব্যবহৃত ট্যাগ")+" — র‍্যাংক করা:", heading: kind==="titles"?"Real Titles":"Real Tags", items:items, kind:kind, _idx:idx});
      appendBubble(m);
    }
  }).catch(function(err){
    loadingEl.remove();
    appendBubble(pushMsg({role:"bot", text:"এরর হয়েছে: "+err.message}));
  });
}

function expandDataMsg(idx, codeboxEl, moreBtn){
  var d=dataStore[idx];
  if(!d){ moreBtn.disabled=true; moreBtn.textContent="Ask again for more (page was reloaded)"; return; }
  moreBtn.disabled=true; moreBtn.innerHTML='<span class="loader-ring"></span> Fetching more...';
  fetchTopVideosForQuery(d.query, d.videoDuration, d.nextPageToken).then(function(res){
    moreBtn.disabled=false; moreBtn.innerHTML="More Related";
    var newVideos=res.videos.filter(function(v){ return d.seenIds.indexOf(v.id)<0; });
    if(!newVideos.length){ moreBtn.textContent="No more results"; moreBtn.disabled=true; return; }
    d.seenIds=d.seenIds.concat(newVideos.map(function(v){return v.id;})); d.nextPageToken=res.nextPageToken;
    var msgObj = messages.filter(function(m){return m._idx===idx;})[0];
    if(!msgObj) return;
    var moreTags = msgObj.kind==="titles" ? [] : rankedTagsFromFrequency(buildTagFrequency(newVideos), 15);
    var moreTitles = msgObj.kind==="tags" ? [] : topTitlesReference(newVideos, 10);
    var addItems = msgObj.kind==="titles" ? moreTitles : moreTags;
    var existingTexts = (msgObj.items||[]).map(function(it){ return (it.text||it.title||"").toLowerCase(); });
    addItems.forEach(function(it){ var key=(it.text||it.title||"").toLowerCase(); if(existingTexts.indexOf(key)<0){ msgObj.items.push(it); existingTexts.push(key); } });
    codeboxEl.innerHTML=renderCodeboxContent(msgObj.items, msgObj.kind);
    persist();
    if(!res.nextPageToken){ moreBtn.textContent="No more results"; moreBtn.disabled=true; }
  }).catch(function(err){ moreBtn.disabled=false; moreBtn.innerHTML="More Related"; alert("Error: "+err.message); });
}

/* ==================== ROUTER (Gemini classifies; YT API supplies all facts) ==================== */
function routeMessage(userText){
  if(!hasGeminiKey()){
    // no Gemini key: fall back to a plain heuristic trigger so the tool still partially works
    var lower=userText.toLowerCase();
    var isData = /tag|title|টাইটেল|ট্যাগ|keyword|কীওয়ার্ড/.test(lower);
    return Promise.resolve({ isDataRequest:isData, dataType: /tag/.test(lower)&&/title/.test(lower)?"both": /tag/.test(lower)?"tags":"titles", niche:userText, videoType: /short/.test(lower)?"shorts": /long/.test(lower)?"long":"both", conversationalReply: isData?"ঠিক আছে, real YouTube ডেটা আনছি...":"(Gemini key নেই তাই সাধারণ চ্যাট রিপ্লাই দিতে পারছি না — Me ট্যাবে Gemini key যোগ করুন)" });
  }
  var recent=messages.slice(-8).map(function(m){ return m.role+": "+(m.text||m.intro||"[data]"); }).join("\n");
  var prompt=["You are a helpful assistant inside a YouTube SEO tool. Decide how to handle the user's latest message.",
    "Recent conversation:\n"+recent,
    "Latest message: \""+userText+"\"",
    "If the user is asking for tags, titles, or keywords for some niche/topic (in Bangla or English, e.g. \"এই niche এর tags দাও\", \"give me titles for X\"), set isDataRequest=true and extract the niche and whether they want shorts/long/both and tags/titles/both.",
    "Otherwise (general conversation, greetings, questions about the tool, anything not a data request) set isDataRequest=false and just write a normal, helpful conversationalReply in the same language the user used.",
    'Return ONLY JSON: {"isDataRequest":true|false,"dataType":"tags"|"titles"|"both","niche":"..."|null,"videoType":"shorts"|"long"|"both","conversationalReply":"..."}'
  ].join("\n");
  return geminiJSON(prompt);
}

function sendMessage(){
  var input=document.getElementById("chatInput");
  var text=input.value.trim(); if(!text) return;
  input.value=""; input.style.height="auto";
  appendBubble(pushMsg({role:"user", text:text}));
  document.getElementById("sendBtn").disabled=true;
  var thinkingEl=appendBubble({role:"bot", text:"..."}, false);
  routeMessage(text).then(function(parsed){
    thinkingEl.remove();
    if(parsed.conversationalReply) appendBubble(pushMsg({role:"bot", text:parsed.conversationalReply}));
    if(parsed.isDataRequest) runDataRequest(parsed);
    document.getElementById("sendBtn").disabled=false;
  }).catch(function(err){
    thinkingEl.remove();
    appendBubble(pushMsg({role:"bot", text: err.message==="NO_GEMINI_KEY" ? "প্রথমে Me ট্যাবে একটা Gemini API key যোগ করুন, তাহলে আমি স্বাভাবিকভাবে কথা বলতে ও বুঝে নিয়ে ডেটা আনতে পারব।" : "এরর: "+err.message}));
    document.getElementById("sendBtn").disabled=false;
  });
}

/* ==================== WIRE UP ==================== */
threadEl.addEventListener("click", function(e){
  var copyBtn=e.target.closest?e.target.closest(".copy-btn"):null;
  var moreBtn=e.target.closest?e.target.closest(".more-btn"):null;
  if(copyBtn){
    var idx=copyBtn.dataset.idx;
    var msgObj=messages.filter(function(m){return String(m._idx)===String(idx);})[0];
    if(msgObj){ navigator.clipboard&&navigator.clipboard.writeText(plainCodeText(msgObj.items,msgObj.kind)).catch(function(){}); copyBtn.textContent="Copied!"; setTimeout(function(){copyBtn.textContent="Copy All";},1500); }
  }
  if(moreBtn){
    var idx2=moreBtn.dataset.idx;
    var codeboxEl=moreBtn.closest(".msg").querySelector(".codebox");
    expandDataMsg(idx2, codeboxEl, moreBtn);
  }
});
document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("chatInput").addEventListener("keydown", function(e){
  if(e.key==="Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
document.getElementById("chatInput").addEventListener("input", function(e){
  e.target.style.height="auto"; e.target.style.height=Math.min(110,e.target.scrollHeight)+"px";
});
document.getElementById("clearBtn").addEventListener("click", function(){
  if(!confirm("পুরো কনভারসেশন মুছে ফেলতে চান?")) return;
  messages=[]; persist(); renderAll();
});
Array.prototype.forEach.call(document.querySelectorAll(".suggest-chip"), function(chip){
  chip.addEventListener("click", function(){ document.getElementById("chatInput").value=chip.dataset.q; sendMessage(); });
});

renderAll();
if(!isOAuthValid()){
  var gateEl=document.createElement("div");
  gateEl.className="info-box";
  gateEl.style.margin="0 0 12px";
  gateEl.innerHTML='<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span>YouTube কানেক্ট নেই — main app-এর Me ট্যাব থেকে আগে কানেক্ট করুন, তারপর এখানে real ডেটা আনতে পারবেন। সাধারণ কথাবার্তার জন্য কানেক্ট করা লাগবে না।</span>';
  threadEl.insertBefore(gateEl, threadEl.firstChild);
}
})();
</script>
